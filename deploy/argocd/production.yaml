apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dakiya-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/baig892/dakiya-devops-takehome.git
    targetRevision: main
    path: deploy/helm/dakiya
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dakiya-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
