
name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/helm/dakiya/values-staging.yaml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r requirements.txt
        working-directory: api

      - name: Run API tests
        run: pytest -q
        working-directory: api

      - name: Build API image
        run: |
          docker build \
            -t ghcr.io/baig892/dakiya-api:${GITHUB_SHA} \
            ./api

      - name: Build worker image
        run: |
          docker build \
            -t ghcr.io/baig892/dakiya-worker:${GITHUB_SHA} \
            ./worker

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/baig892/dakiya-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/baig892/dakiya-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Save scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save \
            ghcr.io/baig892/dakiya-api:${GITHUB_SHA} \
            ghcr.io/baig892/dakiya-worker:${GITHUB_SHA} \
            -o dakiya-images.tar

      - name: Upload scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dakiya-images
          path: dakiya-images.tar
          retention-days: 1

  publish-images:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned images
        uses: actions/download-artifact@v4
        with:
          name: dakiya-images

      - name: Load scanned images
        run: docker load -i dakiya-images.tar

      - name: Login to GHCR
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        run: docker push ghcr.io/baig892/dakiya-api:${GITHUB_SHA}

      - name: Push worker image
        run: docker push ghcr.io/baig892/dakiya-worker:${GITHUB_SHA}

  update-staging-pr:
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update staging image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("deploy/helm/dakiya/values-staging.yaml")
          text = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("api", "worker"):
              pattern = rf"(?ms)^{section}:\n(.*?)(?=^[A-Za-z][A-Za-z0-9_-]*:|\Z)"
              match = re.search(pattern, text)

              if not match:
                  raise SystemExit(f"Missing section: {section}")

              body = match.group(1)

              if re.search(r"(?m)^  tag:", body):
                  body = re.sub(
                      r"(?m)^  tag:.*$",
                      f"  tag: {tag}",
                      body,
                      count=1,
                  )
              else:
                  body = f"  tag: {tag}\n" + body

              text = text[:match.start(1)] + body + text[match.end(1):]

          path.write_text(text)
          PY

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Validate staging Helm chart
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm lint ./deploy/helm/dakiya \
            -f deploy/helm/dakiya/values-staging.yaml

          helm template dakiya ./deploy/helm/dakiya \
            -f deploy/helm/dakiya/values-staging.yaml \
            > /tmp/dakiya-staging.yaml

          grep -F "ghcr.io/baig892/dakiya-api:${IMAGE_TAG}" /tmp/dakiya-staging.yaml
          grep -F "ghcr.io/baig892/dakiya-worker:${IMAGE_TAG}" /tmp/dakiya-staging.yaml

      - name: Create staging promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update staging image tags"
          branch: automation/update-staging-image-tags
          delete-branch: true
          title: "chore(gitops): update staging image tags"
          body: |
            ## Staging image update

            This pull request updates the API and worker image tags
            to the commit SHA produced by the successful CI pipeline.

            Review the image versions before merging.
          base: main
